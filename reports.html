{"source":{"uri":"features/login.feature","data":"Feature: User Login\n\n    Background:\n        Given I am on the login page\n   \n    @smoke @login\n    Scenario: Successful login with valid credentials\n        When I log in with \"standard_user\" and \"secret_sauce\"\n        Then I should be redirected to the products page\n   \n    @login\n    Scenario: Login with invalid password\n        When I log in with \"standard_user\" and \"wrong_password\"\n        Then I should see an error message \"Epic sadface: Username and password do not match any user in this service\"\n   \n    @login\n    Scenario: Successful logout\n        When I log in with \"standard_user\" and \"secret_sauce\"\n        And I logout\n        Then I should be redirected to the login page\n        ","mediaType":"text/x.cucumber.gherkin+plain"}},
{"source":{"uri":"features/remove_item.feature","data":"Feature: Remove product from cart\n\n  Background:\n    Given I am on the login page\n    When I log in with \"standard_user\" and \"secret_sauce\"\n\n  @smoke @cart\n  Scenario Outline: Remove multiple items from the cart\n    Given I add the \"\x3Cproduct_name>\" to my cart\n    And I visit the cart page\n    When I remove the \"\x3Cproduct_name>\" from my cart\n    Then the shopping cart badge should not be visible\n\n  Examples:\n    | product_name              |\n    | Sauce Labs Backpack       |\n    | Sauce Labs Bike Light     |\n    | Sauce Labs Bolt T-Shirt   |","mediaType":"text/x.cucumber.gherkin+plain"}},
{"source":{"uri":"features/shopping.feature","data":"Feature: Shopping Cart\n\n    Background: \n        Given I am on the login page\n        When I log in with \"standard_user\" and \"secret_sauce\"\n\n    @smoke @cart\n    Scenario: Add an item to the cart \n        And I add the \"Sauce Labs Backpack\" to my cart \n        Then the shopping cart badge should show \"1\"\n\n    @cart\n    Scenario: Add two items to the cart\n        When I add the \"Sauce Labs Backpack\" to my cart\n        And I add the \"Sauce Labs Bike Light\" to my cart\n        Then the shopping cart badge should show \"2\"\n","mediaType":"text/x.cucumber.gherkin+plain"}},
